name: 06 - Build - Debug APKs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Options: false = skip; true = authorize selected debug builds and downloads with stored version preserved and ephemeral debug signing. Default: false."
        type: boolean
        default: false
      application:
        description: 'Options: main = build the main app; demo = build the standalone demo; both = build both APKs. Default: main.'
        type: choice
        options: [main, demo, both]
        default: main

permissions:
  contents: read

# Serialize Android work across all hosted workflow files, without cancellation.
concurrency:
  group: mukhtabir-hosted-android
  cancel-in-progress: false

jobs:
  check:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        kind: ${{ fromJSON(inputs.application == 'both' && '["debug","demo"]' || inputs.application == 'main' && '["debug"]' || inputs.application == 'demo' && '["demo"]' || 'invalid-application') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
      - name: Run selected operation
        env:
          CI_OPERATION: ${{ matrix.kind }}-apk
        run: python3 .github/scripts/hosted-android.py "$CI_OPERATION"

      - name: Retain reports and diagnostics for one day
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.kind }}-apk-ephemeral-signer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-output/${{ matrix.kind }}-apk/
          retention-days: 1
          if-no-files-found: warn
