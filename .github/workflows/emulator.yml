name: 07 - Verify - Emulator with visual evidence

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Options: false = skip; true = authorize debug builds, emulator/image downloads, owned-emulator installation and startup/demo capture on selected APIs. Default: false.'
        type: boolean
        default: false
      api:
        description: 'Options: both = run API 29 and 35 serially; 29 = run Android 10 only; 35 = run Android 15 only. Default: both.'
        type: choice
        options: [both, '29', '35']
        default: both

permissions:
  contents: read

concurrency:
  group: mukhtabir-hosted-android
  cancel-in-progress: false

jobs:
  emulator:
    if: ${{ inputs.confirm && github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api: ${{ fromJSON(inputs.api == 'both' && '[29,35]' || inputs.api == '29' && '[29]' || inputs.api == '35' && '[35]' || 'invalid-api-selection') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: mkdir -p ci-output/emulator
      - name: Set up Android tooling
        uses: ./.github/actions/setup-android
      - name: Build the current application without reserving a version
        run: python3 .github/scripts/hosted-android.py debug-apk
      - name: Build the standalone demo APK
        run: python3 .github/scripts/hosted-android.py demo-apk
      - name: Enable KVM on the ephemeral hosted runner
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture the current startup and offline demo
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CI_EXPECTED_API: ${{ matrix.api }}
          CI_AVD_NAME: mukhtabir-ci-api${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          avd-name: mukhtabir-ci-api${{ matrix.api }}
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 .github/scripts/capture-emulator.py
      - name: Retain visual evidence and failure diagnostics for one day
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: emulator-evidence-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-output/emulator/
            ci-output/debug-apk/gradle*.log
            ci-output/demo-apk/gradle*.log
          retention-days: 1
          if-no-files-found: error
